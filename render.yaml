services:
  - type: web
    name: willow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python setup_models.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
