<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Willow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 29C11 20 16 11 25 4' stroke='%237f9572' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M13 21C7 21 4 16 4 12c5 0 9 3 9 9zM17 14c0-6 4-9 8-10 0 5-3 9-8 10z' fill='%2393a885'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Reusable icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-leaf" viewBox="0 0 48 48">
        <path d="M13 44C15.5 32 21 20 33 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M16.6 33.5C9 34 4.8 28.6 4.6 22.4c7.2-.3 12.4 4.4 12 11.1z" fill="currentColor" opacity=".85"/>
        <path d="M19.5 26.5C14.4 20.8 15.4 14.4 19.6 10.4c4.8 4.7 5 11.2-.1 16.1z" fill="currentColor" opacity=".75"/>
        <path d="M22.3 25.4c1.6-7.4 7.6-10.5 13.6-9.7-1.1 7-6.7 10.9-13.6 9.7z" fill="currentColor" opacity=".9"/>
        <path d="M26.4 17.6c-1.7-6.3 1.5-10.8 6.4-12.4 1.5 6-1.3 11-6.4 12.4z" fill="currentColor" opacity=".7"/>
        <path d="M29.2 14.1c3-4.6 7.8-5.2 11.9-3.2-2.8 4.6-7.6 5.6-11.9 3.2z" fill="currentColor" opacity=".8"/>
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M4.5 18.5 5.6 15A7.5 7.5 0 1 1 9 18.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5.5 19c.8-3.3 3.4-5 6.5-5s5.7 1.7 6.5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
        <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-stop" viewBox="0 0 24 24">
        <rect x="7" y="7" width="10" height="10" rx="2.2" fill="currentColor"/>
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M20.5 3.5 10 14M20.5 3.5 14 20.5l-4-6.5-6.5-4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-wave" viewBox="0 0 24 24">
        <path d="M3 10.5v3M6.5 8v8M10 4.5v15M13.5 7v10M17 9.5v5M20.5 11v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-target" viewBox="0 0 24 24">
        <path d="M20.2 9.4A8.6 8.6 0 1 1 14.6 3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M16.3 10.6a4.5 4.5 0 1 1-2.9-2.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M12 12l7.5-7.5M17 4.5h2.5V7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <rect x="7" y="5.5" width="3.2" height="13" rx="1.2" fill="currentColor"/>
        <rect x="13.8" y="5.5" width="3.2" height="13" rx="1.2" fill="currentColor"/>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5.8v12.4a.8.8 0 0 0 1.2.7l9.6-6.2a.8.8 0 0 0 0-1.4L9.2 5.1A.8.8 0 0 0 8 5.8z" fill="currentColor"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path class="sound" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <!-- Left: chat history -->
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-leaf"><use href="#i-leaf"/></svg>
        <div>
          <div class="brand-name">Willow</div>
          <div class="brand-sub">Your voice-enabled AI assistant</div>
        </div>
      </div>
      <button id="new-chat" class="new-chat"><svg><use href="#i-plus"/></svg>New Chat</button>
      <div class="history-label">Chat History</div>
      <nav id="history" class="history" aria-label="Chat history"></nav>
    </aside>

    <!-- Center: conversation -->
    <main class="chat">
      <header class="chat-head">
        <svg class="head-leaf"><use href="#i-leaf"/></svg>
        <div class="head-text">
          <h1>Hi, I’m Willow <svg class="title-leaf"><use href="#i-leaf"/></svg></h1>
          <p>Talk to me by voice or text. I can chat, answer questions, and classify your intent.</p>
        </div>
        <button id="pause" class="pause" hidden aria-label="Pause reply" title="Pause reply">
          <svg><use href="#i-pause"/></svg><span>Pause</span>
        </button>
        <button id="tts" class="tts" aria-pressed="true" title="Read replies aloud" aria-label="Read replies aloud">
          <svg><use href="#i-speaker"/></svg>
        </button>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="composer">
        <div class="voice">
          <button id="mic" class="mic" aria-label="Start speaking"><svg><use href="#i-mic"/></svg></button>
          <div class="voice-meta">
            <div class="wave" aria-hidden="true"></div>
            <div id="status" class="status">Click to speak or start talking...</div>
          </div>
        </div>
        <form id="text-form" class="text-box" autocomplete="off">
          <input id="text" placeholder="Type a message..." aria-label="Type a message">
          <button class="send" type="submit" aria-label="Send"><svg><use href="#i-send"/></svg></button>
        </form>
      </div>
    </main>

    <!-- Right: recognition + classification -->
    <aside class="insights">
      <section class="card">
        <h2><svg class="card-icon"><use href="#i-wave"/></svg>Recognized Speech</h2>
        <div id="recognized" class="recognized empty">Your words will appear here.</div>
      </section>
      <section class="card">
        <h2><svg class="card-icon"><use href="#i-target"/></svg>Intent Classification</h2>
        <div class="intent-box">
          <div class="row"><span>Intent</span><span id="intent" class="pill muted">—</span></div>
          <div class="row"><span>Confidence</span><span id="confidence">—</span></div>
          <div class="bar"><div id="bar-fill"></div></div>
        </div>
      </section>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
